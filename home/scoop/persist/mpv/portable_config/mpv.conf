###############################################################################
# mpv.conf 教学模板
# 适用目标：跟教程边看边改。默认不替大家填设置，只保留配置项名和等号，改完了可以来评论区交作业哦！
#
# 使用方法：
# 1. 把本文件放到 mpv 配置目录：
#    Windows: %APPDATA%\mpv\mpv.conf （直接把%APPDATA%\mpv\复制到资源管理器的地址栏里回车就能打开这个文件夹）
#    portable: mpv.exe同目录\portable_config\mpv.conf
#    macOS/Linux: ~/.config/mpv/mpv.conf
# 2. 每个配置项先保留“选项=”的填空形式。请看完对应解释后，自己在等号后填值。
#    注意：空值行可能无法被 mpv 正常读取；正式使用前请填入参数。
# 3. 如果不确定自己的 mpv 支持哪些值，可以打开cmd，用命令查询（如果装的是portable版本的话，下面的mpv得改成你mpv.exe的完整路径，直接把mpv.exe拖入命令行窗口就行，不用手动输）：
#    mpv --vo=help
#    mpv --gpu-api=help
#    mpv --gpu-context=help
#    mpv --hwdec=help
#    mpv --scale=help
#
# 官方文档核对基准：mpv stable manual
# 注意：mpv 的部分可填值取决于系统、编译选项、显卡驱动和 mpv 版本。
###############################################################################


###############################################################################
# 1. 视频输出路线：vo
###############################################################################
#
# vo 决定 mpv 使用哪条视频输出/渲染路线。
#
# 常用可填值：
#   gpu-next  基于 libplacebo 的现代 GPU 输出。色彩管理、HDR 处理、新 shader
#             支持更完整。新配置推荐从这里开始。
#   gpu       传统 GPU 输出。兼容性通常更好，旧设备或遇到 gpu-next 问题时使用。
#   dmabuf-wayland  Linux/Wayland 下实验性输出，主要搭配特定硬解，不是常规首选。
#   vaapi/vdpau/xv/x11/caca/drm/tct 等  兼容或特殊用途输出。日常观影不建议首选。
#   help      在命令行中用 mpv --vo=help 查看当前版本完整列表。
#
# 推荐值：vo=gpu-next
vo=gpu-next
# 如果你的硬件或系统太老 gpu-next 黑屏、颜色异常或启动失败，改成：
# vo=gpu


###############################################################################
# 2. GPU API：gpu-api
###############################################################################
#
# gpu-api 可以简单理解为播放器用哪种图形 API 和显卡沟通。
#
# 官方稳定可填值：
#   auto    自动选择。兼容优先，跨系统最稳。默认 GPU API 可能随版本改变。
#   opengl 只允许 OpenGL。兼容面广，但现代 HDR/新渲染路径不一定最理想。
#   vulkan 只允许 Vulkan。现代路径，常用于 gpu-next；需要驱动和编译支持。
#   d3d11  只允许 Direct3D 11，Windows 专用。Windows 上常推荐，能帮助探测
#          输出位深；非 Windows 会报不支持。
#
# 推荐值：gpu-api=auto
gpu-api=auto
#
# Windows 用户可以尝试：
# gpu-api=d3d11
#
# 想明确走 Vulkan，且 mpv --gpu-api=help 里有 vulkan：
# gpu-api=vulkan


###############################################################################
# 3. GPU 上下文：gpu-context
###############################################################################
#
# gpu-context 决定具体窗口系统/平台后端。一般不需要手动写，auto 最省心。
#
# 常见可填值：
#   auto       自动选择。默认推荐。
#   d3d11      Windows 原生 D3D11。
#   winvk      Windows Vulkan。
#   angle      Windows 通过 ANGLE 使用 D3D11/OpenGL ES 翻译层。
#   win        Windows WGL/OpenGL。
#   macvk      macOS 上通过 Metal 翻译层使用 Vulkan。
#   wayland    Linux Wayland/EGL。
#   waylandvk  Linux Wayland/Vulkan。
#   x11/x11egl Linux X11/OpenGL。
#   x11vk      Linux X11/Vulkan。
#   drm        Linux DRM/EGL。
#   displayvk  直接 Vulkan display 输出，偏特殊用途。
#   android    Android/EGL，嵌入式场景。
#   help       用 mpv --gpu-context=help 查看当前构建支持哪些。
#
# 推荐值：gpu-context=auto
gpu-context=auto
#
# Windows + d3d11 固定路线可尝试：
# gpu-context=d3d11


###############################################################################
# 4. 硬件解码：hwdec
###############################################################################
#
# hwdec 决定视频解码交给 CPU 还是交给显卡/专用视频解码单元。
# 硬解通常是为了降低 CPU 占用和功耗，不是画质增强选项。
#
# 通用可填值：
#   no                关闭硬解，使用 CPU 软件解码。兼容性最好，也最利于滤镜链路。
#   auto / yes / auto-safe
#                     启用 mpv 认为相对安全的白名单硬解。yes 与 auto 等价。
#   auto-copy / auto-copy-safe
#                     启用 copy-back 硬解：显卡解码后把画面拷回内存。更适合之后
#                     叠加需要 CPU 处理的视频滤镜，但会有额外性能开销。
#   auto-unsafe       尝试所有硬解方式，不限白名单。只建议排错/测试。
#   auto-copy-unsafe  copy-back 版本的 unsafe。只建议排错/测试。
#
# 平台/显卡相关可填值，取决于当前 mpv 构建：
#   d3d11va / d3d11va-copy       Windows 8+，D3D11 硬解；-copy 会拷回内存。
#   videotoolbox / videotoolbox-copy
#                                macOS/iOS 硬解；-copy 会拷回内存。
#   vaapi / vaapi-copy           Linux Intel/AMD 常见硬解；-copy 会拷回内存。
#   nvdec / nvdec-copy           NVIDIA 推荐硬解；-copy 会拷回内存。
#   drm / drm-copy               Linux DRM 硬解；-copy 会拷回内存。
#   vulkan / vulkan-copy         Vulkan Video 硬解，需要 vo=gpu-next 与 Vulkan 支持。
#   dxva2 / dxva2-copy           旧 Windows 路线，官方不认为安全，通常不推荐。
#   vdpau / vdpau-copy           旧 Linux/NVIDIA 路线，通常不推荐新配置使用。
#   mediacodec / mediacodec-copy Android 硬解。
#   cuda / cuda-copy             NVIDIA 旧实现，通常优先 nvdec。
#   crystalhd / rkmpp            特定旧硬件/特定设备用途。
#
# 简单取舍：
#   CPU 足够强、希望兼容和画质链路最稳：no
#   想省电/降 CPU，且不怎么叠 CPU 滤镜：auto
#   想硬解又准备叠加较多滤镜：auto-copy
#
# 推荐默认值：hwdec=no
hwdec=no


###############################################################################
# 5. 基础缩放：scale / cscale / dscale
###############################################################################
#
# scale  亮度/主图像缩放。1080p 拉到 4K、窗口大小变化时会用到。
# cscale 色度缩放。视频常用 4:2:0 色度半采样，颜色通道需要拉到亮度通道大小。
# dscale 降采样。源分辨率大于窗口/显示器时使用。
# 这里还会多讲一种画面瑕疵，视频里实在讲不下了，振铃（ring）就是拉伸时过度锐化或一些错误的边缘重构容易导致线条边上看起来有一圈光晕。单用这里的缩放算法其实都不太会引入严重的振铃，但是如果下期和更强的shader算法结合叠加起来就容易出现了。
#
# 当前常见完整滤镜列表，可用 mpv --scale=help 以你的版本为准：
#   bilinear, bicubic_fast, oversample, spline16, spline36, spline64,
#   sinc, lanczos, ginseng, bicubic, hermite, catmull_rom, mitchell,
#   robidoux, robidouxsharp, box, nearest, triangle, gaussian, jinc,
#   ewa_lanczos, ewa_hanning, ewa_ginseng, ewa_lanczossharp,
#   ewa_lanczos4sharpest, ewa_lanczossoft, haasnsoft,
#   ewa_robidoux, ewa_robidouxsharp, bartlett, cosine, hanning,
#   tukey, hamming, quadric, welch, kaiser, blackman, sphinx
#
# 常用值效果速记：
#   bilinear       快，软，兼容好，质量一般。
#   bicubic_fast   很快，质量普通，低性能设备可用。
#   spline36/64    较平衡，锐度和振铃都比较克制。
#   lanczos        锐，但可能有振铃。
#   ewa_lanczos    常用高质量放大，适合现代 GPU。
#   ewa_lanczossharp / ewa_lanczos4sharpest
#                  更锐，也更可能带来振铃/边缘伪影。
#   mitchell       柔和均衡，伪影少，锐度不激进。
#   catmull_rom    比 mitchell 更锐，更容易振铃。
#   nearest        最近邻，像素风/整数感强，不适合普通动画观影。
#   oversample     减少近邻缩放的小抖动，也可作 tscale。
#
# 推荐值：基础缩放用较稳的 EWA Lanczos。更强的超分 shader 之后再加。
#   scale=ewa_lanczos
#   cscale=ewa_lanczos
#   dscale=mitchell
scale=ewa_lanczos
cscale=ewa_lanczos
dscale=mitchell

# antiring 用于降低缩放振铃。范围 0.0-1.0；0 关闭，越大抑制越强但可能变软。
# gpu-next 下对 EWA 类缩放也有效，部分 scaler alias 还会隐式启用抗振铃。
# 推荐值：
#   scale-antiring=0.6
#   cscale-antiring=0.6
scale-antiring=0.6
cscale-antiring=0.6

# correct-downscaling=yes 会在卷积降采样时扩展滤镜尺寸，提高降采样质量但更耗性能。
# 推荐值：correct-downscaling=yes
correct-downscaling=yes

# sigmoid-upscaling=yes 会在放大时做 sigmoid 处理，降低振铃被放大的观感。默认通常启用。
# 推荐值：sigmoid-upscaling=yes
sigmoid-upscaling=yes


###############################################################################
# 6. 抖动：dither / dither-depth
###############################################################################
#
# 抖动用于在高精度处理结果降到显示器可输出位深时，降低色阶断层/色带感。
#
# dither 可填值：
#   fruit            默认常用算法。质量好，开销合理。
#   ordered          有序抖动，速度快，可能更容易看到图案感。
#   error-diffusion  误差扩散，质量潜力高，但需要 compute shader 和较多共享内存；
#                    不满足条件时会回退到 fruit。
#   no               关闭 mpv 抖动算法。
#
# dither-depth 可填值：
#   auto  自动选择。gpu 下通常为检测到的位深，否则 8 bpc；gpu-next 对 SDR target
#         也是检测到位深或 8 bpc。
#   no    禁止 mpv 执行抖动。
#   N     指定目标位深，如 8、10。Windows d3d11 对链路位深探测更可靠。
#
# 推荐值：
#   dither=fruit
#   dither-depth=auto
dither=fruit
dither-depth=auto

# fruit 模式矩阵大小，范围 2-8；默认 6，即 64x64。越大启动计算越慢（但也并不是越大效果就一定越好）。
# 推荐值：dither-size-fruit=6
dither-size-fruit=6

# temporal-dither 会随帧改变抖动图案，可能减少静态图案感，也可能在 LCD 上产生闪烁。
# 可填 yes/no。
# 推荐值：temporal-dither=no
temporal-dither=no


###############################################################################
# 7. 去色带：deband
###############################################################################
#
# deband 用于减轻片源或处理链路中的色带、块状量化痕迹。副作用是可能轻微糊掉细节。
#
# deband 可填值：
#   yes  开启内置去色带。
#   no   关闭。默认更保守，避免对本来干净的片源过度处理。
#
# deband-iterations 范围 0-16：
#   每个采样执行多少步。越高越强也越慢，官方也提示 >4 基本没什么实用意义。
#
# deband-threshold 范围 0-4096，默认 48：
#   截止阈值。越高去色带越强，但越容易损伤细节。
#
# deband-range 范围 1-64，默认 16：
#   初始半径。越高能找更大范围的渐变；越低会更激进地涂平局部。
#
# deband-grain 范围 0-4096，默认 32：
#   添加少量噪声遮盖剩余量化痕迹。越高噪声越明显。
#
# 对于动画推荐默认开启；能有效改善动画暗部、天空渐变、压制产生的色带。
# 推荐值：
#   deband=yes
#   deband-iterations=1
#   deband-threshold=48
#   deband-range=16
#   deband-grain=32
deband=yes
deband-iterations=1
deband-threshold=48
deband-range=16
deband-grain=32


###############################################################################
# 8. 插帧/顺滑播放：interpolation
###############################################################################
#
# 这里的 interpolation 不是把 24fps 补成 60fps 的“补帧”，而是解决视频帧率与
# 显示器刷新率不整除时的节奏不均匀 judder，类似 madVR smooth motion 的用途。
#
# interpolation 可填值：
#   yes  开启时间轴插值。
#   no   关闭。
#
# 开启interpolation 需要 video-sync 使用 display-* 模式，否则会被静默禁用。
#
# video-sync 常用可填值：
#   audio                    默认。按音频时钟同步，最稳，但可能偶发丢/重复帧。
#   display-resample         推荐搭配 interpolation。轻微重采样音频匹配显示器。
#   display-resample-vdrop   类似上面，但通过丢视频帧补偿漂移。
#   display-resample-desync  类似上面，但不补偿音画同步漂移。
#   display-tempo            类似 display-resample，但用音频滤镜变速避免音高变化。
#   display-vdrop            丢/重复视频帧补偿。
#   display-adrop            丢/重复音频数据，可能有严重音频伪影，不推荐。
#   display-desync           视频跟显示器，音频自己走，测试用，不推荐日常。
#   desync                   视频按系统时钟，音频自己走，测试用，不推荐日常。
#
# tscale 是 temporal scaler，只有 interpolation 开启时使用：
#   oversample     默认，最锐/最不模糊，smooth motion 感更克制。
#   linear         更平滑一点。
#   catmull_rom    较锐。
#   mitchell       均衡。
#   gaussian       更柔和。
#   bicubic        更平滑也更模糊。
#
# 推荐默认关闭；对 judder 特别敏感时打开下面三行。（如需使用SVP或类似RIFE之类的补帧算法，则一定不要开启，这项功能会交由对应插件实现，）
# 关闭时推荐值：
#   interpolation=no
#   video-sync=audio
#   tscale=oversample
# 需要开启时推荐配置：
#   interpolation=yes
#   video-sync=display-resample
#   tscale=oversample
interpolation=no
video-sync=audio
tscale=oversample




###############################################################################
# 9. HDR / 色彩管理
###############################################################################
#
# 对动画用户来说，HDR 片源本来就相对少，系统/播放器/显示器链路又很容易乱。
# 这里给保守模板：让 mpv 自动处理，不主动把 SDR 伪装成 HDR。
#
# target-colorspace-hint 可填值，仅 gpu-next：
#   auto  默认。当前平台/上下文能确定目标显示参数时设置输出色彩空间元数据。
#   yes   总是尝试设置元数据；需要你自己确保 target-* 和显示器能力匹配。
#   no    不设置。除非非常明确知道链路怎么走，否则不建议。
#
# target-colorspace-hint-mode 可填值，仅较新的 gpu-next：
#   注意：官方 stable 手册已列出此项，但部分老版本mpv可能还不支持。
#   不支持时写入配置会报 option not found，所以默认保持注释。
#   target          默认。按目标显示能力设置/适配元数据。
#   source          传统 HDR passthrough 思路，按片源元数据交给系统/显示器处理。
#   source-dynamic  类似 source，但尝试使用动态场景元数据，实验性。
#
# tone-mapping 可填值：
#   auto       默认。gpu 下映射到 bt.2390；gpu-next 下映射到 spline。
#   clip       直接裁掉超范围值。范围内颜色最准，但高光会硬裁，不常推荐。
#   mobius     平滑映射，较重视范围内颜色准确。
#   reinhard   简单连续曲线，整体亮度保留但对比可能变平。
#   hable      游戏常见曲线，较保高光/暗部细节，但可能变暗/降饱和。
#   bt.2390    ITU-R BT.2390 感知曲线。
#   gamma      对数/幂函数式映射。
#   linear     线性拉伸。
#   spline     gpu-next 专用，感知线性的单支点多项式。
#   bt.2446a   gpu-next 专用，ITU-R BT.2446 Method A，适合规范母版内容。
#   st2094-40  gpu-next 专用，HDR10+ 动态元数据映射；无元数据时回退固定曲线。
#   st2094-10  gpu-next 专用，动态映射方法，通常不如 st2094-40。
#
# target-prim 可填值：
#   auto, bt.470m, bt.601-525, bt.601-625, bt.709, bt.2020, apple,
#   adobe, prophoto, cie1931, dci-p3, display-p3, v-gamut, s-gamut
#
# target-trc 可填值：
#   auto, bt.1886, srgb, linear, gamma1.8, gamma2.0, gamma2.2, gamma2.4,
#   gamma2.6, gamma2.8, prophoto, pq, hlg, v-log, s-log1, s-log2
#
# target-peak 可填值：
#   auto  自动，SDR 通常按 203 nits；HDR 尝试按目标显示能力。
#   数字  手动指定显示器峰值亮度，单位 nits/cd/m^2，例如 100、203、600、1000。
#
# inverse-tone-mapping 可填 yes/no：
#   yes 会允许 SDR->HDR 逆向映射或让 HDR 更亮。很容易搞出不自然画面，谨慎。
#
# 保守推荐：
#   target-colorspace-hint=auto
#   tone-mapping=auto
#   target-prim=auto
#   target-trc=auto
#   target-peak=auto
#   inverse-tone-mapping=no
target-colorspace-hint=auto
# target-colorspace-hint-mode=target
tone-mapping=auto
target-prim=auto
target-trc=auto
target-peak=auto
inverse-tone-mapping=no

# 如果你明确只想把 HDR 转 SDR，可尝试：
# target-trc=bt.1886
# target-prim=bt.709
# tone-mapping=bt.2446a
#
# 如果你明确想走 HDR passthrough，且系统/显示器链路都配置好了，可尝试：
# target-colorspace-hint=yes
# target-colorspace-hint-mode=source


###############################################################################
# 10. Shader 预留区
###############################################################################
#
# glsl-shader 每写一行就追加一个 shader。
# glsl-shaders 会替换整个 shader 列表；新手更推荐用 glsl-shader 逐个追加。
#
# gpu-next 支持 glsl-shader-opts 给可调 shader 传参数：
# glsl-shader-opts=参数1=值1,参数2=值2
#
# 建议：先保证无 shader 基线播放正常，再逐个加入缩放、去色带、锐化等 shader。
#
# 示例，按你的实际文件路径取消注释：
# glsl-shader="~~/shaders/Anime4K_Upscale_Denoise_CNN_x2_M.glsl"
# glsl-shader="~~/shaders/SSimSuperRes.glsl"


###############################################################################
# 11. 可选配置 Profile
###############################################################################
#
# 下期会有一定篇幅来讲这一块，也就是上面填的所有配置其实我们可以存成一个预设，针对不同的片源，需要的时候可以直接启用对应的预设，不需要来回改参数
# 这些 profile 不会默认生效，只在命令行指定或 input.conf 绑定快捷键或在mpv.conf开头调用时启用，实际案例可以去看一下我上期彩蛋提供的.conf文件。

##缓存设置##

#开启缓存
cache=yes
#最大缓存大小（KiB或MiB）
demuxer-max-bytes=64MiB
#用内存而不是磁盘缓存
cache-on-disk=no
#缓存时间
#cache-secs=8

##播放状态记录##

#退出时记住播放状态（包括是否暂停、音量、播放速度、位置等）
save-position-on-quit
#播放状态保存位置
#watch-later-directory=D:\Cache\watch_later
#不记录是否暂停（除了pause同理可写fullscreen,mute,speed,ontop等参数）
watch-later-options-remove=pause
#记录播放状态时忽略文件路径（便于备份/共享，但会影响同名文件区分）
#ignore-path-in-watch-later-config

##窗口设置##

#贴边吸附（限windows平台）
snap-window=yes
#高分屏窗口缩放
#hidpi-window-scale=no
#无边框
border=yes
#置顶
ontop=yes
#全屏
#fullscreen=yes
#窗口保持视频比例
#keepaspect-window=no
#播完后保持打开（yes|no|always）
#keep-open=no
#将窗口缩放窗口模式下至大、至小占屏幕的百分比
#autofit-larger=90%x90%
#autofit-smaller=30%x30%
#设置默认打开的窗口大小、位置(下例是1280x720、屏幕左下角）
#geometry=1280x720+100%+100%
#拖入文件行为设置（no/auto/replace/append)。no禁用拖入，auto根据平台自动选择，replace替换当前文件并播放，append将拖入的文件添加到播放列表。默认是拖入replace，按住shift拖入append
drag-and-drop=auto

##OSD设置##

#关闭屏上信息条显示
#osd-bar=no
#osd-bar边框大小，mpv0.37.0之后版本加入此选项
osd-bar-border-size=0
#osd-bar宽度[1,100],屏幕宽度的百分比
osd-bar-w=100
#osd-bar高度[0.1,50]屏幕高度的百分比
osd-bar-h=0.3
#位置[-1,1]x为左到右，y为上到下
osd-bar-align-y=1
#OSD颜色，ARGB16进制表示
osd-color="#FFFFFF"
#OSD背景颜色，同样16进制ARGB，前两位为透明度值
#osd-back-color="#30000000"
#OSD信息位置、字体大小、边框大小(左中右left/center/right,上中下top/center/buttom)
osd-align-x=left
osd-align-y=top
osd-font-size=22
osd-border-size=2
#设置OSD文本信息的持续时间（毫秒）
osd-duration=2000
#OSD随窗口大小缩放
osd-scale-by-window=no

##视频/音频/字幕/截图设置##

#读取杜比视界元数据(需要将vo=gpu改为实验性的vo=gpu-next)
#vf=format:dolbyvision=yes
#色彩管理
#icc-profile-auto=yes
#视频同步
#video-sync=display-resample
#interpolation=yes
#变速播放时的音调修正
audio-pitch-correction=yes
#音调修正的不静音最大倍速
#af=scaletempo2=max-speed=4
#自动加载外部字幕文件方式。（fuzzy加载同文件夹含有视频文件名的字幕文件）
sub-auto=fuzzy
#自动加载含有视频文件名的音频文件
#audio-file-auto=fuzzy
#字体大小，此值是以高度为720的屏幕为比例，更大或更小的屏幕会缩放
sub-font-size=44
#未指定样式的字幕字体
sub-font=sans-serif
#未指定样式的字幕边框
sub-border-size=2
#强制外挂ass字幕可使用黑边
sub-ass-force-margins=yes
#指定优先使用音轨（使用ISO-639语言代码，优先级按序递减）
alang=zh,chi,chs,sc,zh-hans,en,eng
#指定优先使用字幕轨（同上）
slang=zh,chi,chs,sc,zh-hans,en,eng
#列表播放循环方式，N|inf|no，循环N次/一直循环/不循环
loop-playlist=inf
#启动默认音量
volume=90
#程序最大音量[100,1000]
volume-max=100
#截屏文件格式（可选：jpg、png、webp、jxl、avif）
screenshot-format=png
#截屏文件保存路径
screenshot-directory="~/Pictures/mpv"
#截屏文件命名格式
screenshot-template="%F %wH-%wM-%wS-%wT"

##杂项##

#禁用内置快捷键方案，builtin与default相比不影响脚本的预设快捷键
input-builtin-bindings=no
#关闭内置屏上控制On Screen Controller(OSC)
#osc=no
#输出日志到桌面
#log-file = "~~desktop/mpv.txt"
#录制媒体流到指定文件
#stream-record=C:\Videos\output.mp4

##配置组##
#不要在配置组之间插入常规配置

#高画质渲染模式，0.37.0后默认启用
#profile=high-quality

#高性能低功耗模式，适合低性能设备
#profile=fast

#暂停或全屏时不置顶
[ontop-playback]
profile-cond=pause or fullscreen
ontop=no
profile-restore=copy

#当文件所在路径包含'music'时，禁用记录播放状态、OSC常驻
#[music]
#profile-cond=require 'mp.utils'.join_path(working_directory, path):match('music') ~= nil
#save-position-on-quit=no
#script-opts-add=osc-visibility=always
#profile-restore=copy

#Customization
secondary-sid=no