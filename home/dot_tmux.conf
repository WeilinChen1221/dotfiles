# Enable mouse selection and scrolling
set -g mouse on

# Use vi-style keys in copy mode
setw -g mode-keys vi

# Copy selected text directly to the macOS clipboard
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"

# Optional: drag with the mouse, release, and copy automatically
bind-key -T copy-mode-vi MouseDragEnd1Pane \
  send-keys -X copy-pipe-and-cancel "pbcopy"

# Run the same interactive zsh used outside tmux.  New panes will read
# $ZDOTDIR/.zshrc and initialize Starship and the highlighting plugins.
set -g default-shell /bin/zsh

# Keep applications on tmux's full 256-colour terminfo entry.  Apple Terminal
# on macOS 15 advertises xterm-256color but does not support RGB escape
# sequences, so do not add the RGB/Tc terminal feature here.
set -g default-terminal "tmux-256color"

# Refresh the custom zsh configuration path whenever a client attaches.
# Use a fixed array slot so reloading this file does not append duplicates.
set -g update-environment[100] "ZDOTDIR"

# Reload tmux configuration with prefix + r.
bind-key r source-file ~/.tmux.conf \; display-message "tmux.conf reloaded"
